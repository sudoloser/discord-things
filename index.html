<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Discord Things</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .portal-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 2rem;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            min-height: 180px;
        }
        
        .portal-card:hover {
            background: var(--surface-hover);
        }
        
        .portal-icon {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        
        .portal-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .portal-desc {
            color: var(--text-secondary);
            font-size: 0.9375rem;
            line-height: 1.5;
        }

        .wip-badge {
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
            display: inline-block;
        }
        
        .portal-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Discord Things</h1>
            <p>A collection of random stuff for Discord.</p>
        </header>

        <div class="portal-grid">
            <a href="clients/index.html" class="portal-card">
                <i class="fa-solid fa-desktop portal-icon"></i>
                <div class="portal-title">Clients</div>
                <div class="portal-desc">Browse custom Discord client definitions and assets.</div>
            </a>
            <a href="fonts/index.html" class="portal-card">
                <i class="fas fa-font portal-icon"></i>
                <div class="portal-title">Fonts</div>
                <div class="portal-desc">Preview and download custom fonts for Discord clients.</div>
            </a>
            
            <a href="plugins/index.html" class="portal-card">
                <i class="fas fa-plug portal-icon"></i>
                <div class="portal-title">Plugins</div>
                <div class="portal-desc">Vendetta and Revenge plugins to enhance your mobile experience.</div>
            </a>
        </div>

        <footer>
            <p>Powered by GitHub Pages</p>
        </footer>
    </div>
</body>
</html>
